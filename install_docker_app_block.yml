# Included (not run directly) with docker_app (loop var: {name, path_prefix,
# and optionally image/port/expose_http for a custom app not in the
# catalog}), docker_app_catalog, app_hostname, wordpress_db_password already
# set by the caller.

- name: Ensure app directory exists for {{ docker_app.name }}
  ansible.builtin.file:
    path: "/opt/{{ docker_app.name }}"
    state: directory
    mode: "0755"

- name: Template compose file for {{ docker_app.name }}
  ansible.builtin.template:
    # A custom image (docker_app.image set) always uses the generic
    # single-container template, driven by the entry's own image/port -
    # otherwise it's a catalog preset with its own dedicated template.
    src: "{{ 'docker_apps/custom-app.yml.j2' if docker_app.image is defined else 'docker_apps/' ~ docker_app.name ~ '.yml.j2' }}"
    dest: "/opt/{{ docker_app.name }}/docker-compose.yml"
    mode: "0644"
  vars:
    path_prefix: "{{ docker_app.path_prefix | default('/') }}"
    app_name: "{{ docker_app.name }}"
    app_image: "{{ docker_app.image | default('') }}"
    app_port: "{{ docker_app.port | default('') }}"
    expose_http: "{{ docker_app.expose_http | default(true) }}"
  no_log: "{{ docker_app.name == 'wordpress' }}"

- name: Start {{ docker_app.name }}
  ansible.builtin.command: docker compose up -d
  args:
    chdir: "/opt/{{ docker_app.name }}"
  changed_when: true
