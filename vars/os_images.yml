---
# Shared OS catalog for VM cloud-init templates. All entries are genuinely
# free, anonymously-downloadable cloud images (no registration/subscription) -
# each publisher's stable "current"/"latest" URL, so these never need manual
# bumping as new point releases come out.
#
# RHEL-family entries (CentOS Stream 9, Rocky 9, AlmaLinux 9) were tried and
# removed: their cloud images hung at boot under Proxmox's default kvm64 CPU
# type (confirmed root cause), and separately their cloud-init never applied
# our custom user-data even once that was worked around - not worth the
# ongoing maintenance burden for this catalog. Ubuntu/Debian only for now.
os_image_lookup:
  ubuntu-24.04:
    name: "ubuntu-24.04-template"
    url: "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img"
  ubuntu-22.04:
    name: "ubuntu-22.04-template"
    url: "https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img"
  debian-12:
    name: "debian-12-template"
    url: "https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-genericcloud-amd64.qcow2"
