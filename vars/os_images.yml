---
# Shared OS catalog for VM cloud-init templates. All entries are genuinely
# free, anonymously-downloadable cloud images (no registration/subscription) -
# each publisher's stable "current"/"latest" URL, so these never need manual
# bumping as new point releases come out. Real RHEL is intentionally excluded:
# it requires a Red Hat account + subscription-manager registration, a
# different mechanism than a plain image download. Rocky/AlmaLinux are the
# free RHEL-compatible options instead. Fedora/openSUSE are intentionally
# excluded too - their official images are version-pinned, not stable
# "latest" aliases, so they'd silently go stale without manual upkeep.
os_image_lookup:
  ubuntu-24.04:
    name: "ubuntu-24.04-template"
    url: "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img"
  ubuntu-22.04:
    name: "ubuntu-22.04-template"
    url: "https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img"
  debian-12:
    name: "debian-12-template"
    url: "https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-genericcloud-amd64.qcow2"
  centos-9-stream:
    name: "centos-9-stream-template"
    url: "https://cloud.centos.org/centos/9-stream/x86_64/images/CentOS-Stream-GenericCloud-9-latest.x86_64.qcow2"
  rocky-9:
    name: "rocky-9-template"
    url: "https://download.rockylinux.org/pub/rocky/9/images/x86_64/Rocky-9-GenericCloud.latest.x86_64.qcow2"
  almalinux-9:
    name: "almalinux-9-template"
    url: "https://repo.almalinux.org/almalinux/9/cloud/x86_64/images/AlmaLinux-9-GenericCloud-latest.x86_64.qcow2"
