---
# Catalog of Docker app presets deployable via Install_Docker_And_App.yml.
# Every field here is just a DEFAULT - any docker_apps entry can override
# any of them, or skip the catalog entirely with its own image/port for a
# custom app. See install_docker_app_block.yml for the resolution order.
#
# Fields:
#   image, port            - what to run and what port it listens on
#   expose_http            - true: gets an HTTP path route through Traefik
#                             (needs path_prefix on the entry). false: no
#                             Traefik route at all (the entry may still use
#                             tcp_funnel_port instead, or stay fully internal).
#   default_volumes        - list of "source:target[:mode]" strings, same
#                             syntax as `docker run -v` / compose's own
#                             volumes list - named volumes and bind mounts
#                             can be mixed freely, any number of entries.
#   default_command         - default command override (a list)
#   default_environment      - default environment variables (a dict)
#
# wordpress is a genuine multi-service dependency graph (app + its own DB),
# so it keeps its own dedicated template instead of using the generic one -
# everything else here is a single container.
docker_app_catalog:
  nginx:
    image: "nginx:latest"
    port: 80
    expose_http: true
  wordpress:
    image: "wordpress:latest"
    port: 80
    expose_http: true
  portainer:
    image: "portainer/portainer-ce:latest"
    port: 9000
    expose_http: true
    default_volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "portainer_data:/data"
  redis:
    image: "redis:latest"
    port: 6379
    expose_http: false
  mongodb:
    image: "mongo:latest"
    port: 27017
    expose_http: false
    default_volumes:
      - "mongodb_data:/data/db"
