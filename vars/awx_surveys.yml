---
provision_vm_survey:
  name: ""
  description: ""
  spec:
    - question_name: "OS Type"
      type: multiplechoice
      variable: os_type
      required: true
      choices: "ubuntu-24.04\nubuntu-22.04\ndebian-12"
      default: "ubuntu-24.04"
    - question_name: "VM Name"
      type: text
      variable: vm_name
      required: true
    - question_name: "VM User"
      type: text
      variable: vm_user
      required: false
      default: "pronto"
    - question_name: "Memory (MB)"
      type: integer
      variable: memory
      required: false
      default: 2048
    - question_name: "CPU Cores"
      type: integer
      variable: cores
      required: false
      default: 2
    - question_name: "Disk Size"
      type: text
      variable: disk_size
      required: false
      default: "15G"
    - question_name: "Storage"
      type: text
      variable: storage
      required: false
      default: "local-lvm"
    - question_name: "Bridge"
      type: text
      variable: bridge
      required: false
      default: "vmbr0"
    - question_name: "Tailscale Auth Key"
      type: password
      variable: tailscale_authkey
      required: true

install_docker_app_survey:
  name: ""
  description: ""
  # 'docker_apps' (a list of app objects) doesn't fit AWX Survey's flat field
  # types (text/password/multiplechoice/integer). Set it directly in the Job
  # Template's "Variables" field as YAML instead. Every field works the same
  # way for any app - a database, a web server, or a custom image - and
  # falls back to a vars/docker_apps.yml catalog default when omitted:
  #   docker_apps:
  #     - name: nginx                 # catalog preset
  #       path_prefix: "/"            # HTTP path-routed through Traefik
  #     - name: my-app                # custom image, any registry
  #       image: "myregistry.example.com/my-app:1.2.3"
  #       port: 3000
  #       path_prefix: "/myapp"
  #     - name: redis                 # catalog preset, internal-only by default
  #     - name: redis-external        # any name - reachable OUTSIDE the tailnet
  #       image: "redis:latest"
  #       port: 6379
  #       command: ["redis-server", "--requirepass", "some-strong-password"]
  #       tcp_funnel_port: 10000      # 443, 8443, or 10000 - must not collide
  #                                   # with the HTTP apps' Funnel port (443)
  # (path_prefix is ignored whenever expose_http resolves to false; setting
  # tcp_funnel_port on any entry is itself the opt-in for that one app,
  # independent of expose_to_internet below - auth is the entry's own
  # responsibility via command/environment, never expose a database this way
  # without one)
  spec:
    - question_name: "Target Host"
      question_description: "Tailnet hostname of the VM from the Provision VM job (vm_name)"
      type: text
      variable: target_host
      required: true
    - question_name: "WordPress DB Password"
      question_description: "Only used when wordpress is one of the docker_apps"
      type: password
      variable: wordpress_db_password
      required: false
      default: ""

expose_app_to_internet_survey:
  name: ""
  description: ""
  spec:
    - question_name: "Target Host"
      question_description: "Tailnet hostname of the VM (vm_name from the Provision VM job)"
      type: text
      variable: target_host
      required: true
    - question_name: "VM User"
      type: text
      variable: vm_user
      required: false
      default: "pronto"
    - question_name: "Port to Expose"
      question_description: "Local port the already-running service is listening on"
      type: integer
      variable: expose_port
      required: false
      default: 80

delete_vm_survey:
  name: ""
  description: ""
  spec:
    - question_name: "VM Name"
      question_description: "The VM to delete, by name (as passed to vm_name when it was created)"
      type: text
      variable: vm_name
      required: true

delete_lxc_survey:
  name: ""
  description: ""
  spec:
    - question_name: "Container Name"
      question_description: "The LXC container to delete, by name (as passed to ct_name when it was created)"
      type: text
      variable: ct_name
      required: true

delete_docker_app_survey:
  name: ""
  description: ""
  spec:
    - question_name: "Target Host"
      question_description: "Tailnet hostname of the VM the app is running on"
      type: text
      variable: target_host
      required: true
    - question_name: "VM User"
      type: text
      variable: vm_user
      required: false
      default: "pronto"
    - question_name: "App Name"
      question_description: "The docker_apps entry name to remove (its /opt/<app_name> directory) - Traefik and other apps on the same VM are untouched"
      type: text
      variable: app_name
      required: true

create_lxc_app_survey:
  name: ""
  description: ""
  spec:
    - question_name: "Container Name"
      type: text
      variable: ct_name
      required: true
    - question_name: "OS Template"
      type: text
      variable: os_template
      required: false
      default: "ubuntu-24.04-standard"
    - question_name: "Memory (MB)"
      type: integer
      variable: memory
      required: false
      default: 1024
    - question_name: "CPU Cores"
      type: integer
      variable: cores
      required: false
      default: 1
    - question_name: "Disk Size (GB)"
      type: integer
      variable: ct_disk_gb
      required: false
      default: 8
    - question_name: "Storage"
      type: text
      variable: storage
      required: false
      default: "local-lvm"
    - question_name: "Bridge"
      type: text
      variable: bridge
      required: false
      default: "vmbr0"
    - question_name: "App Choice"
      type: text
      variable: app_choice
      required: false
      default: "nginx"
    - question_name: "Tailscale Auth Key"
      type: password
      variable: tailscale_authkey
      required: true
