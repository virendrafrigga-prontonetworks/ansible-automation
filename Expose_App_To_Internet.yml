---
- name: Register the target VM for this run
  hosts: localhost
  gather_facts: false
  vars:
    target_host: "dev-vm01"          # From AWX Survey - the VM's tailnet hostname (vm_name from Playbook 1)
    vm_user: "pronto"                 # From AWX Survey - must match the vm_user used to provision this VM
  tasks:
    - name: Add target VM to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ target_host }}"
        ansible_user: "{{ vm_user }}"
        groups: expose_target

- name: Expose an already-running service on this VM to the public internet via Tailscale Funnel
  hosts: expose_target
  become: true
  gather_facts: false

  vars:
    # Whatever's already listening on this port gets exposed - doesn't matter
    # whether it was installed via Docker, apt (nginx/apache/anything), or
    # built by hand. Requires this VM's tailscale node to already be approved
    # and connected, and the tailnet ACL's nodeAttrs to grant "funnel" to its tag.
    expose_port: 80                  # From AWX Survey

  tasks:
    # Device approval is a manual, external step in the Tailscale admin
    # console and can take anywhere from seconds to days - this doesn't wait
    # or fail on it. It hands off to a detached script running inside the VM
    # that polls until approved, then enables Funnel on its own.
    - name: Render the Tailscale Funnel enable script content
      ansible.builtin.set_fact:
        funnel_enable_script: "{{ lookup('template', playbook_dir + '/templates/enable-funnel.sh.j2') }}"
      vars:
        tailscale_hostname: "{{ target_host }}"

    - name: Push the Funnel enable script to the VM
      ansible.builtin.copy:
        content: "{{ funnel_enable_script }}"
        dest: /usr/local/bin/enable-funnel.sh
        mode: "0700"

    - name: Start the Funnel enable script as a detached systemd unit
      ansible.builtin.command: >-
        systemd-run --unit=enable-funnel --collect --no-block /usr/local/bin/enable-funnel.sh
      changed_when: true

    - name: Show access instructions
      ansible.builtin.debug:
        msg: >-
          A background script on {{ target_host }} is waiting for tailnet admin approval, then will expose
          port {{ expose_port }} at https://{{ target_host }}.<your-tailnet>.ts.net - check
          /var/log/tailscale-funnel.log there for status.
