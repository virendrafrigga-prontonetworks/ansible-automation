---
- name: Delete a VM created by Create_VM_From_MultiVM_Template.yml
  hosts: all
  gather_facts: false
  become: true

  vars:
    # HARDCODED per-host SSH policy, keyed by the Proxmox host's IP - see
    # the matching note in Create_VM_From_MultiVM_Template.yml.
    ssh_policy_by_host:
      "100.85.205.16": { user: pronto, ssh_password: "wavespot@202!", become_password: "wavespot@202!" }
    ansible_user: "{{ ssh_policy_by_host[inventory_hostname].user | default('root') }}"
    ansible_password: "{{ ssh_policy_by_host[inventory_hostname].ssh_password | default(omit) }}"
    ansible_become_password: "{{ ssh_policy_by_host[inventory_hostname].become_password | default(omit) }}"
    vm_name: "edgecompute-vm03"   # HARDCODED for UI testing - matches Create_VM_From_MultiVM_Template.yml's test vm_name

  tasks:
    - name: Force the VM name for this UI-testing round, ignoring any vm_name the caller supplies
      # See the matching note in Create_VM_From_MultiVM_Template.yml - the
      # EdgeCompute frontend was stamping vm_name with a generic
      # "<inventory name> / <host IP>" label on every launch, and extra_vars
      # always outrank this file's own vars: block, so reassigning vm_name
      # itself would be silently ignored.
      ansible.builtin.set_fact:
        resolved_vm_name: "edgecompute-vm03"

    - name: Look up the VM's ID by name
      ansible.builtin.shell: |
        set -o pipefail
        qm list | awk -v name="{{ resolved_vm_name }}" '$2==name {print $1}'
      args:
        executable: /bin/bash
      register: existing_vm
      changed_when: false

    - name: Report and stop here if no VM with this name exists
      when: existing_vm.stdout | trim | length == 0
      ansible.builtin.debug:
        msg: "No VM named '{{ resolved_vm_name }}' found - nothing to delete."

    - name: Stop and destroy the VM
      when: existing_vm.stdout | trim | length > 0
      vars:
        target_vmid: "{{ existing_vm.stdout | trim }}"
      block:
        - name: Stop the VM if it's running
          ansible.builtin.command: qm stop {{ target_vmid }}
          changed_when: true
          failed_when: false

        - name: Destroy the VM
          ansible.builtin.command: qm destroy {{ target_vmid }} --purge
          changed_when: true

        - name: Show result
          ansible.builtin.debug:
            msg: "VM '{{ resolved_vm_name }}' (VMID {{ target_vmid }}) has been destroyed."
