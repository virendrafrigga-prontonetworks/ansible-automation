# Included (not run directly) with os_type, os_image_lookup, iso_dir,
# local_cache_dir, storage, bridge, memory, cores already set by the caller.
# Leaves `template_id` and `template_name` set in the parent scope either way.

- name: Set template name and image URL for {{ os_type }}
  ansible.builtin.set_fact:
    template_name: "{{ os_image_lookup[os_type]['name'] }}"
    image_url: "{{ os_image_lookup[os_type]['url'] }}"

- name: Check whether this template already exists on the Proxmox host
  ansible.builtin.shell: |
    set -o pipefail
    qm list | awk -v name="{{ template_name }}" '$2==name {print $1}'
  args:
    executable: /bin/bash
  register: existing_template
  changed_when: false

- name: Record existing template ID, if found
  ansible.builtin.set_fact:
    template_id: "{{ existing_template.stdout | trim }}"
  when: existing_template.stdout | trim | length > 0

- name: Build and register the template if it doesn't already exist
  when: existing_template.stdout | trim | length == 0
  block:
    - name: Set image filenames
      ansible.builtin.set_fact:
        local_image_file: "{{ local_cache_dir }}/{{ image_url | basename }}"
        remote_image_file: "{{ iso_dir }}/{{ image_url | basename }}"

    - name: Ensure local image cache directory exists on the Ansible worker
      ansible.builtin.file:
        path: "{{ local_cache_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false

    - name: Download cloud image on the Ansible worker
      ansible.builtin.get_url:
        url: "{{ image_url }}"
        dest: "{{ local_image_file }}"
        mode: "0644"
        force: false
      delegate_to: localhost
      become: false

    - name: Ensure ISO directory exists on the Proxmox host
      ansible.builtin.file:
        path: "{{ iso_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Check whether the image is already staged on the Proxmox host
      ansible.builtin.stat:
        path: "{{ remote_image_file }}"
      register: remote_image_stat

    - name: Push the cloud image from the Ansible worker to the Proxmox host
      ansible.builtin.copy:
        src: "{{ local_image_file }}"
        dest: "{{ remote_image_file }}"
        mode: "0644"
      when: not remote_image_stat.stat.exists

    - name: Get next free template ID
      ansible.builtin.command: pvesh get /cluster/nextid
      register: nextid
      changed_when: false

    - name: Set new template ID fact
      ansible.builtin.set_fact:
        template_id: "{{ nextid.stdout | trim }}"

    - name: Create VM shell for the template
      # --cpu matters: Proxmox's default (kvm64) is a very old, generic CPU
      # model missing modern instruction sets. Confirmed twice now with real
      # evidence, not speculation: (1) it can't boot RHEL9-family kernels at
      # all (CentOS/Rocky/AlmaLinux hung silently at boot - see git history),
      # and (2) it lacks AVX, which MongoDB 5.0+ requires - every mongo
      # container crash-loops with exit code 132 (SIGILL) under kvm64,
      # confirmed live and matches MongoDB/Proxmox's own documented fix.
      # 'host' passes through the real physical CPU's features, guaranteeing
      # both are covered - fine for this single-node Proxmox setup with no
      # live-migration-to-different-hardware concern.
      ansible.builtin.command: >-
        qm create {{ template_id }}
        --name {{ template_name }}
        --memory {{ memory }}
        --cores {{ cores }}
        --cpu host
        --net0 virtio,bridge={{ bridge }}
      args:
        creates: "/etc/pve/qemu-server/{{ template_id }}.conf"

    - name: Import disk to storage
      ansible.builtin.command: qm importdisk {{ template_id }} {{ remote_image_file }} {{ storage }}
      changed_when: true

    - name: Configure VM hardware for disk
      ansible.builtin.command: >-
        qm set {{ template_id }}
        --scsihw virtio-scsi-pci
        --scsi0 {{ storage }}:vm-{{ template_id }}-disk-0
      changed_when: true

    - name: Configure VM hardware for cloud-init
      ansible.builtin.command: qm set {{ template_id }} --ide2 {{ storage }}:cloudinit
      changed_when: true

    - name: Configure boot order
      ansible.builtin.command: qm set {{ template_id }} --boot c --bootdisk scsi0
      changed_when: true

    - name: Configure serial console
      ansible.builtin.command: qm set {{ template_id }} --serial0 socket --vga serial0
      changed_when: true

    - name: Enable QEMU Guest Agent flag
      ansible.builtin.command: qm set {{ template_id }} --agent enabled=1
      changed_when: true

    - name: Convert VM to a template
      ansible.builtin.command: qm template {{ template_id }}
      changed_when: true

    - name: Show template creation message
      ansible.builtin.debug:
        msg: "Cloud-init template '{{ template_name }}' with ID {{ template_id }} created for OS {{ os_type }}."
