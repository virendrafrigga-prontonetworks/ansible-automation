# Included (not run directly) with current_os_type, os_image_lookup, iso_dir,
# local_cache_dir, storage, bridge, memory, cores already set by the caller.
# Leaves `template_id` and `template_name` set in the parent scope either way.

- name: Set template name and image URL for {{ current_os_type }}
  # image_url substitutes this host's target_arch for the "amd64" embedded
  # in every vars/os_images.yml URL - a no-op on an amd64 host (existing
  # behavior unchanged), swaps in the real arm64 variant on an arm64 host.
  ansible.builtin.set_fact:
    template_name: "{{ os_image_lookup[current_os_type]['name'] }}"
    image_url: "{{ os_image_lookup[current_os_type]['url'] | replace('amd64', target_arch) }}"

- name: Check whether this template already exists on the Proxmox host
  ansible.builtin.shell: |
    set -o pipefail
    qm list | awk -v name="{{ template_name }}" '$2==name {print $1}'
  args:
    executable: /bin/bash
  register: existing_template
  changed_when: false

- name: Record existing template ID, if found
  ansible.builtin.set_fact:
    template_id: "{{ existing_template.stdout | trim }}"
  when: existing_template.stdout | trim | length > 0

- name: Read the existing template's config, if found
  when: existing_template.stdout | trim | length > 0
  ansible.builtin.command: qm config {{ existing_template.stdout | trim }}
  register: existing_template_config
  changed_when: false

- name: Stop the existing template before destroying it, if it's not actually finished
  # qm destroy refuses to touch a running VM ("VM is running - destroy
  # failed", confirmed live one level up on the VM-clone side) - a
  # broken/incomplete template shell could in principle still be left
  # running too, so stop it first rather than assuming it's always stopped.
  when: >-
    existing_template.stdout | trim | length > 0 and
    ('agent: 1' not in existing_template_config.stdout or 'scsi0:' not in existing_template_config.stdout)
  ansible.builtin.command: qm stop {{ existing_template.stdout | trim }}
  failed_when: false
  changed_when: true

- name: Destroy an existing template that never actually finished building
  # A name match alone can't tell a genuinely finished template from a
  # half-built leftover - confirmed live: an earlier run can fail partway
  # through (e.g. the disk-attach bug fixed earlier) and still leave a
  # VM shell that satisfies "does a template with this name exist?",
  # with no real scsi0 disk and no agent: 1. Every later run silently
  # reused that broken shell instead of rebuilding it, producing clones
  # with no disk at all. Same idempotency gap already fixed on the LXC
  # side - verify actual completeness, not just that the name matches.
  # Retries because qm stop above doesn't block until fully powered off.
  when: >-
    existing_template.stdout | trim | length > 0 and
    ('agent: 1' not in existing_template_config.stdout or 'scsi0:' not in existing_template_config.stdout)
  ansible.builtin.command: qm destroy {{ existing_template.stdout | trim }} --purge
  register: destroyed_incomplete_template
  until: destroyed_incomplete_template.rc == 0
  retries: 6
  delay: 5
  changed_when: true

- name: Build and register the template if it doesn't already exist (or was just destroyed for being incomplete)
  when: existing_template.stdout | trim | length == 0 or destroyed_incomplete_template is changed
  block:
    - name: Set image filenames
      ansible.builtin.set_fact:
        local_image_file: "{{ local_cache_dir }}/{{ image_url | basename }}"
        remote_image_file: "{{ iso_dir }}/{{ image_url | basename }}"

    - name: Ensure local image cache directory exists on the Ansible worker
      ansible.builtin.file:
        path: "{{ local_cache_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false

    - name: Download cloud image on the Ansible worker
      ansible.builtin.get_url:
        url: "{{ image_url }}"
        dest: "{{ local_image_file }}"
        mode: "0644"
        force: false
      delegate_to: localhost
      become: false

    - name: Ensure ISO directory exists on the Proxmox host
      ansible.builtin.file:
        path: "{{ iso_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Check whether the image is already staged on the Proxmox host
      ansible.builtin.stat:
        path: "{{ remote_image_file }}"
      register: remote_image_stat

    - name: Push the cloud image from the Ansible worker to the Proxmox host
      ansible.builtin.copy:
        src: "{{ local_image_file }}"
        dest: "{{ remote_image_file }}"
        mode: "0644"
      when: not remote_image_stat.stat.exists

    - name: Get next free template ID
      ansible.builtin.command: pvesh get /cluster/nextid
      register: nextid
      changed_when: false

    - name: Set new template ID fact
      ansible.builtin.set_fact:
        template_id: "{{ nextid.stdout | trim }}"

    - name: Create VM shell for the template
      # --cpu matters: Proxmox's default (kvm64) is a very old, generic CPU
      # model missing modern instruction sets. Confirmed twice now with real
      # evidence, not speculation: (1) it can't boot RHEL9-family kernels at
      # all (CentOS/Rocky/AlmaLinux hung silently at boot - see git history),
      # and (2) it lacks AVX, which MongoDB 5.0+ requires - every mongo
      # container crash-loops with exit code 132 (SIGILL) under kvm64,
      # confirmed live and matches MongoDB/Proxmox's own documented fix.
      # 'host' passes through the real physical CPU's features, guaranteeing
      # both are covered - fine for this single-node Proxmox setup with no
      # live-migration-to-different-hardware concern.
      ansible.builtin.command: >-
        qm create {{ template_id }}
        --name {{ template_name }}
        --memory {{ memory }}
        --cores {{ cores }}
        --cpu host
        --net0 virtio,bridge={{ resolved_bridge }}
      args:
        creates: "/etc/pve/qemu-server/{{ template_id }}.conf"

    - name: Import disk to storage
      # Capture Proxmox's own reported volume ID instead of guessing one -
      # confirmed live: "{{ resolved_storage }}:vm-{{ template_id }}-disk-0"
      # (LVM-thin naming) fails outright on directory-type storage like
      # "local" ("unable to parse directory volume name"), because
      # importdisk actually names the file differently there (e.g.
      # "local:100/vm-100-disk-0.raw") - the real answer varies by storage
      # type/backend, so read it back rather than hardcoding a format that
      # only happens to match LVM-thin.
      # Real output confirmed live: "unusedN: successfully imported disk
      # '<volid>'" - the unusedN label comes first on the line (not
      # embedded in the quotes), lowercase "successfully", no "as", and
      # the quoted volid itself has no unusedN prefix at all. An earlier
      # version of this pattern assumed the opposite layout and captured
      # the wrong span of text entirely - fixed against the real line,
      # not assumption.
      ansible.builtin.shell: |
        set -o pipefail
        qm importdisk {{ template_id }} {{ remote_image_file }} {{ resolved_storage }} | grep -oP "successfully imported disk '\K[^']+"
      args:
        executable: /bin/bash
      register: importdisk_result
      changed_when: true

    - name: Fail clearly if the imported disk's volume ID couldn't be determined
      ansible.builtin.fail:
        msg: >-
          qm importdisk didn't report a parseable volume ID - check its output on the host directly
          for {{ template_id }} on storage '{{ resolved_storage }}'.
      when: importdisk_result.stdout | trim | length == 0

    - name: Set the actual imported disk volume ID
      ansible.builtin.set_fact:
        imported_disk_volid: "{{ importdisk_result.stdout | trim }}"

    - name: Configure VM hardware for disk
      ansible.builtin.command: >-
        qm set {{ template_id }}
        --scsihw virtio-scsi-pci
        --scsi0 {{ imported_disk_volid }}
      changed_when: true

    - name: Configure VM hardware for cloud-init
      ansible.builtin.command: qm set {{ template_id }} --ide2 {{ resolved_storage }}:cloudinit
      changed_when: true

    - name: Configure boot order
      ansible.builtin.command: qm set {{ template_id }} --boot c --bootdisk scsi0
      changed_when: true

    - name: Configure serial console
      ansible.builtin.command: qm set {{ template_id }} --serial0 socket --vga serial0
      changed_when: true

    - name: Enable QEMU Guest Agent flag
      ansible.builtin.command: qm set {{ template_id }} --agent enabled=1
      changed_when: true

    - name: Convert VM to a template
      ansible.builtin.command: qm template {{ template_id }}
      changed_when: true

    - name: Show template creation message
      ansible.builtin.debug:
        msg: "Cloud-init template '{{ template_name }}' with ID {{ template_id }} created for OS {{ current_os_type }}."
