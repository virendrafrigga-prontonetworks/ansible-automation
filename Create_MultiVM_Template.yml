---
- name: Pre-seed Cloud-Init Templates on Proxmox
  hosts: all
  gather_facts: false
  become: true

  vars_files:
    - vars/os_images.yml

  vars:
    iso_dir: "/var/lib/vz/template/iso"
    local_cache_dir: "{{ playbook_dir }}/.image_cache"
    storage: "local-lvm"                   # From AWX Survey
    bridge: "vmbr0"                        # From AWX Survey
    memory: 2048                            # Optional via AWX
    cores: 2                                # Optional via AWX

    os_types:                               # From AWX Survey (multi-select) - any subset of vars/os_images.yml's keys
      - ubuntu-24.04
      - ubuntu-22.04
      - debian-12

  tasks:
    - name: Loop through selected OS types to ensure templates exist
      ansible.builtin.include_tasks: create_template_block.yml
      loop: "{{ os_types }}"
      loop_control:
        loop_var: os_type
