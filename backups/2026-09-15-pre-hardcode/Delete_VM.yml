---
- name: Delete a VM created by Create_VM_From_MultiVM_Template.yml
  hosts: all
  gather_facts: false
  become: true

  vars:
    vm_name: "dev-vm01"          # From AWX Survey - the VM to delete, by name

  tasks:
    - name: Look up the VM's ID by name
      ansible.builtin.shell: |
        set -o pipefail
        qm list | awk -v name="{{ vm_name }}" '$2==name {print $1}'
      args:
        executable: /bin/bash
      register: existing_vm
      changed_when: false

    - name: Report and stop here if no VM with this name exists
      when: existing_vm.stdout | trim | length == 0
      ansible.builtin.debug:
        msg: "No VM named '{{ vm_name }}' found - nothing to delete."

    - name: Stop and destroy the VM
      when: existing_vm.stdout | trim | length > 0
      vars:
        target_vmid: "{{ existing_vm.stdout | trim }}"
      block:
        - name: Stop the VM if it's running
          ansible.builtin.command: qm stop {{ target_vmid }}
          changed_when: true
          failed_when: false

        - name: Destroy the VM
          ansible.builtin.command: qm destroy {{ target_vmid }} --purge
          changed_when: true

        - name: Show result
          ansible.builtin.debug:
            msg: "VM '{{ vm_name }}' (VMID {{ target_vmid }}) has been destroyed."
