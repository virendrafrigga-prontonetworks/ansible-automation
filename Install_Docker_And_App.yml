---
- name: Register the target VM for this run
  hosts: localhost
  gather_facts: false
  vars:
    target_host: "dev-vm01"          # From AWX Survey - the VM's tailnet hostname (vm_name from Playbook 1)
    vm_user: "pronto"                 # From AWX Survey - must match the vm_user used to provision this VM
  tasks:
    - name: Add target VM to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ target_host }}"
        ansible_user: "{{ vm_user }}"
        groups: docker_target

- name: Install Docker, Compose and Traefik, then deploy the chosen app
  hosts: docker_target
  become: true
  gather_facts: true

  vars:
    app_choice: "nginx"                       # From AWX Survey - nginx | wordpress | portainer
    app_hostname: "{{ target_host }}"          # From AWX Survey - Host() the app should answer to behind Traefik
    wordpress_db_password: ""                  # From AWX Survey/Vault - required when app_choice == wordpress
    # Private by default - only expose to the real internet if explicitly asked.
    # Everything here goes through Traefik on 80, regardless of app_choice, so
    # this doesn't need to vary per-app the way LXC's expose_port might.
    expose_to_internet: false                  # From AWX Survey
    expose_port: 80                            # From AWX Survey - Traefik's own port

  tasks:
    - name: Check if Docker is already installed
      ansible.builtin.command: docker --version
      register: docker_check
      changed_when: false
      failed_when: false

    - name: Install Docker (Debian/Ubuntu)
      when: docker_check.rc != 0
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: true

    - name: Ensure Docker service is running
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Check whether the shared 'web' Docker network exists
      ansible.builtin.command: docker network inspect web
      register: web_network_check
      changed_when: false
      failed_when: false

    - name: Create shared 'web' Docker network for Traefik routing
      ansible.builtin.command: docker network create web
      when: web_network_check.rc != 0

    - name: Deploy Traefik reverse proxy
      block:
        - name: Ensure Traefik directory exists
          ansible.builtin.file:
            path: /opt/traefik
            state: directory
            mode: "0755"

        - name: Template Traefik compose file
          ansible.builtin.template:
            src: docker_apps/traefik-compose.yml.j2
            dest: /opt/traefik/docker-compose.yml
            mode: "0644"

        - name: Start Traefik
          ansible.builtin.command: docker compose up -d
          args:
            chdir: /opt/traefik
          changed_when: true

    - name: Deploy the selected application
      block:
        - name: Ensure app directory exists
          ansible.builtin.file:
            path: "/opt/{{ app_choice }}"
            state: directory
            mode: "0755"

        - name: Template app compose file
          ansible.builtin.template:
            src: "docker_apps/{{ app_choice }}.yml.j2"
            dest: "/opt/{{ app_choice }}/docker-compose.yml"
            mode: "0644"
          no_log: "{{ app_choice == 'wordpress' }}"

        - name: Start the application
          ansible.builtin.command: docker compose up -d
          args:
            chdir: "/opt/{{ app_choice }}"
          changed_when: true

    - name: Mark this node as a Tailscale docker-host (per team tag scheme)
      ansible.builtin.command: tailscale set --advertise-tags=tag:vm-provisioned,tag:docker-host
      changed_when: true
      # Requires your tailnet ACL's tagOwners to permit this node re-tagging itself as tag:docker-host.

    - name: Expose this app to the public internet via Tailscale Funnel
      # Private by default. Only runs when explicitly requested - requires the
      # ACL's nodeAttrs to grant "funnel" to this node's tag beforehand, and
      # requires the node to already be approved/connected on the tailnet.
      when: expose_to_internet | bool
      block:
        - name: Check whether this node is approved and connected on the tailnet
          ansible.builtin.command: tailscale status --json
          register: ts_status
          changed_when: false

        - name: Stop here if this node isn't approved yet
          ansible.builtin.fail:
            msg: >-
              {{ target_host }} is not yet approved on the tailnet - approve it in the Tailscale admin
              console (Machines page), then re-run this job with expose_to_internet=true.
          when: not ((ts_status.stdout | from_json).Self.MachineAuthorized | default(true))

        - name: Configure Tailscale Serve for the local app port
          ansible.builtin.command: tailscale serve --bg {{ expose_port }}
          changed_when: true

        - name: Enable Tailscale Funnel to make it publicly reachable
          ansible.builtin.command: tailscale funnel 443 on
          changed_when: true

    - name: Show access instructions
      ansible.builtin.debug:
        msg: >-
          Docker app '{{ app_choice }}' deployed on {{ target_host }}, routed through Traefik on ports 80/443
          for Host(`{{ app_hostname }}`).
          {{ ('Exposed to the public internet via Tailscale Funnel at https://' ~ target_host ~ '.<your-tailnet>.ts.net')
             if (expose_to_internet | bool)
             else ('Private - reachable only over the tailnet at ' ~ target_host ~ ' (or its tailnet IP).'
                   ~ ' Re-run this job with expose_to_internet=true if you want it public.') }}
