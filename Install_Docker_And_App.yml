---
- name: Register the target VM for this run
  hosts: localhost
  gather_facts: false
  vars:
    target_host: "dev-vm01"          # From AWX Survey - the VM's tailnet hostname (vm_name from Playbook 1)
    vm_user: "pronto"                 # From AWX Survey - must match the vm_user used to provision this VM
  tasks:
    - name: Add target VM to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ target_host }}"
        ansible_user: "{{ vm_user }}"
        groups: docker_target

- name: Install Docker, Compose and Traefik, then deploy the chosen apps
  hosts: docker_target
  become: true
  gather_facts: true

  vars_files:
    - vars/docker_apps.yml

  vars:
    # From AWX Survey - one VM can run several containers side by side. Each
    # docker_apps entry works the same way regardless of what it is - a
    # database, a web server, or any custom app - with the same range as a
    # plain `docker run` command:
    #   name: <docker_app_catalog key, or anything for a custom app>
    #   image, port            - required for a custom app; override a catalog
    #                            preset's defaults too, if given
    #   command, environment   - optional passthroughs to the container (e.g.
    #                            a database's own auth setup)
    #   volumes                - list of "source:target[:mode]" strings, same
    #                            syntax as `docker run -v` - named volumes and
    #                            bind mounts freely mixed, any number of them
    #   ports                  - list of "host:container" strings for any
    #                            EXTRA port publishing beyond expose_http/
    #                            tcp_funnel_port below (like `docker run -p`)
    #   extra_compose           - raw dict merged straight into the compose
    #                            service definition, for anything not covered
    #                            above (restart policy, user, privileged,
    #                            entrypoint, healthcheck, cap_add, etc)
    #   expose_http + path_prefix - HTTP path-routing through Traefik, shared
    #                            across every HTTP app on the one Funnel URL
    #   tcp_funnel_port        - raw TCP Funnel forwarding (443/8443/10000),
    #                            for a non-HTTP service (e.g. a database)
    #                            reachable from genuinely outside the tailnet.
    #                            Independent of expose_to_internet below -
    #                            setting this on an entry is itself the
    #                            opt-in. Auth is the entry's own
    #                            responsibility via command/environment -
    #                            never set this on a database with no auth.
    # Any field left unset falls back to the catalog preset's default (see
    # vars/docker_apps.yml); a name with no matching preset is a fully
    # custom app and needs its own image/port.
    docker_apps:
      - name: nginx
        path_prefix: "/"
    wordpress_db_password: ""                  # From AWX Survey/Vault - required when wordpress is in docker_apps
    # Private by default - only expose to the real internet if explicitly asked.
    # Covers every HTTP app above at once, via the one shared Traefik/Funnel URL.
    expose_to_internet: false                  # From AWX Survey
    expose_port: 80                            # From AWX Survey - Traefik's own port

  tasks:
    - name: Check if Docker is already installed
      ansible.builtin.command: docker --version
      register: docker_check
      changed_when: false
      failed_when: false

    - name: Install Docker (Debian/Ubuntu)
      when: docker_check.rc != 0
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: true

    - name: Ensure Docker service is running
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Check whether the shared 'web' Docker network exists
      ansible.builtin.command: docker network inspect web
      register: web_network_check
      changed_when: false
      failed_when: false

    - name: Create shared 'web' Docker network for Traefik routing
      ansible.builtin.command: docker network create web
      when: web_network_check.rc != 0

    - name: Check whether the shared 'internal' Docker network exists
      # Private, never published, never routed by Traefik - lets apps reach
      # a database container on this same VM (e.g. "redis:6379") without
      # that database ever being reachable from the 'web' network or the
      # public Funnel URL.
      ansible.builtin.command: docker network inspect internal
      register: internal_network_check
      changed_when: false
      failed_when: false

    - name: Create shared 'internal' Docker network for inter-container access
      ansible.builtin.command: docker network create internal
      when: internal_network_check.rc != 0

    - name: Deploy Traefik reverse proxy
      block:
        - name: Ensure Traefik directory exists
          ansible.builtin.file:
            path: /opt/traefik
            state: directory
            mode: "0755"

        - name: Template Traefik compose file
          ansible.builtin.template:
            src: docker_apps/traefik-compose.yml.j2
            dest: /opt/traefik/docker-compose.yml
            mode: "0644"

        - name: Start Traefik
          # --quiet-pull suppresses per-layer pull progress, which can run to
          # megabytes of output and get truncated by AWX's log display,
          # burying the actual error underneath it. Captured explicitly and
          # re-raised below so the real failure is always fully visible in
          # the job output itself - no need to SSH in and look for it.
          ansible.builtin.command: docker compose up -d --quiet-pull
          args:
            chdir: /opt/traefik
          register: traefik_up
          changed_when: true
          failed_when: false

        - name: Fail with the full Traefik startup error, if any
          ansible.builtin.fail:
            msg: "Traefik failed to start (rc={{ traefik_up.rc }}):\n{{ traefik_up.stderr }}"
          when: traefik_up.rc != 0

    - name: Deploy each requested app
      ansible.builtin.include_tasks: install_docker_app_block.yml
      loop: "{{ docker_apps }}"
      loop_control:
        loop_var: docker_app

    - name: Expose any app with tcp_funnel_port set outside the tailnet
      # Generic - works for any docker_apps entry, not just a specific name.
      # Independent of expose_to_internet below - setting tcp_funnel_port on
      # an entry is itself the explicit opt-in for that one app.
      ansible.builtin.include_tasks: expose_tcp_funnel_block.yml
      loop: "{{ docker_apps | selectattr('tcp_funnel_port', 'defined') | list }}"
      loop_control:
        loop_var: docker_app

    - name: Expose HTTP apps to the public internet via Tailscale Funnel
      # Private by default. Only runs when explicitly requested. Approval can
      # take anywhere from seconds to days, so this doesn't wait or fail on
      # it here - it hands off to a detached script running inside the VM
      # that polls until approved, then enables Funnel on its own. One Funnel
      # endpoint covers every HTTP app deployed above, path-routed by Traefik.
      when: expose_to_internet | bool
      block:
        - name: Render the Tailscale Funnel enable script content
          ansible.builtin.set_fact:
            funnel_enable_script: "{{ lookup('template', playbook_dir + '/templates/enable-funnel.sh.j2') }}"
          vars:
            tailscale_hostname: "{{ target_host }}"

        - name: Push the Funnel enable script to the VM
          ansible.builtin.copy:
            content: "{{ funnel_enable_script }}"
            dest: /usr/local/bin/enable-funnel.sh
            mode: "0700"

        - name: Start the Funnel enable script as a detached systemd unit
          ansible.builtin.command: >-
            systemd-run --unit=enable-funnel --collect --no-block /usr/local/bin/enable-funnel.sh
          changed_when: true

    - name: Show access instructions
      ansible.builtin.debug:
        msg: >-
          Deployed on {{ target_host }} behind Traefik (ports 80/443, routed by path - reachable via the tailnet
          hostname, tailnet IP, or public Funnel URL alike):
          {% for a in docker_apps %}{% set catalog_entry = docker_app_catalog[a.name] | default({}) %}{% set is_http = a.expose_http | default(catalog_entry.expose_http | default(true)) %}{{ a.name }}{{ (' via TCP Funnel on port ' ~ a.tcp_funnel_port ~ ' (reachable outside the tailnet)') if a.tcp_funnel_port is defined else (' at path ' ~ (a.path_prefix | default('/')) if is_http else ' (internal-only, no path/Funnel access)') }}{{ ', ' if not loop.last else '' }}{% endfor %}.
          {{ ('A background script on ' ~ target_host ~ ' is waiting for tailnet admin approval, then will expose it '
              ~ 'at https://' ~ target_host ~ '.<your-tailnet>.ts.net - check /var/log/tailscale-funnel.log there for status.')
             if (expose_to_internet | bool)
             else ('Private - reachable only over the tailnet at ' ~ target_host ~ ' (or its tailnet IP).'
                   ~ ' Re-run this job with expose_to_internet=true if you want it public.') }}
