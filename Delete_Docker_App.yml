---
- name: Register the target VM for this run
  hosts: localhost
  gather_facts: false
  vars:
    target_host: "edgecompute-lxc01"  # HARDCODED for UI testing - matches Install_Docker_And_App.yml's test target_host
    vm_user: "root"                   # HARDCODED for UI testing - "root" because target_host above is an LXC container
  tasks:
    - name: Add target VM to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ target_host }}"
        ansible_user: "{{ vm_user }}"
        groups: docker_target

- name: Delete Docker apps from this VM, leaving Traefik untouched
  hosts: docker_target
  become: true
  gather_facts: false

  vars:
    # HARDCODED for UI testing - matches the docker_apps entry deployed by
    # Install_Docker_And_App.yml's test run
    app_names:
      - "edgecompute-nginx"

  tasks:
    - name: Delete each requested app
      ansible.builtin.include_tasks: delete_docker_app_block.yml
      loop: "{{ app_names }}"
      loop_control:
        loop_var: current_app_name
