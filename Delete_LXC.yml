---
- name: Delete an LXC container created by Create_LXC_App.yml
  hosts: all
  gather_facts: false
  become: true

  vars:
    # HARDCODED per-host SSH policy, keyed by the Proxmox host's IP - see
    # the matching note in Create_VM_From_MultiVM_Template.yml.
    ssh_policy_by_host:
      "100.85.205.16": { user: pronto, become_password: "wavespot@202!" }
    ansible_user: "{{ ssh_policy_by_host[inventory_hostname].user | default('root') }}"
    ansible_become_password: "{{ ssh_policy_by_host[inventory_hostname].become_password | default(omit) }}"
    ct_name: "edgecompute-lxc03"  # HARDCODED for UI testing - matches Create_LXC_App.yml's test ct_name

  tasks:
    - name: Force the container name for this UI-testing round, ignoring any ct_name the caller supplies
      # See the matching note in Create_LXC_App.yml - the EdgeCompute
      # frontend was stamping ct_name with a generic
      # "<inventory name> / <host IP>" label on every launch, and extra_vars
      # always outrank this file's own vars: block, so reassigning ct_name
      # itself would be silently ignored.
      ansible.builtin.set_fact:
        resolved_ct_name: "edgecompute-lxc03"

    - name: Look up the container's ID by name
      ansible.builtin.shell: |
        set -o pipefail
        pct list | awk -v name="{{ resolved_ct_name }}" '$3==name {print $1}'
      args:
        executable: /bin/bash
      register: existing_ct
      changed_when: false

    - name: Report and stop here if no container with this name exists
      when: existing_ct.stdout | trim | length == 0
      ansible.builtin.debug:
        msg: "No LXC container named '{{ resolved_ct_name }}' found - nothing to delete."

    - name: Stop and destroy the container
      when: existing_ct.stdout | trim | length > 0
      vars:
        target_ctid: "{{ existing_ct.stdout | trim }}"
      block:
        - name: Stop the container if it's running
          ansible.builtin.command: pct stop {{ target_ctid }}
          changed_when: true
          failed_when: false

        - name: Destroy the container
          ansible.builtin.command: pct destroy {{ target_ctid }} --purge
          changed_when: true

        - name: Show result
          ansible.builtin.debug:
            msg: "LXC container '{{ resolved_ct_name }}' (CTID {{ target_ctid }}) has been destroyed."
