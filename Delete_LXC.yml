---
- name: Delete an LXC container created by Create_LXC_App.yml
  hosts: all
  gather_facts: false
  become: true

  vars:
    ct_name: "app-lxc01"          # From AWX Survey - the container to delete, by name

  tasks:
    - name: Look up the container's ID by name
      ansible.builtin.shell: |
        set -o pipefail
        pct list | awk -v name="{{ ct_name }}" '$3==name {print $1}'
      args:
        executable: /bin/bash
      register: existing_ct
      changed_when: false

    - name: Report and stop here if no container with this name exists
      when: existing_ct.stdout | trim | length == 0
      ansible.builtin.debug:
        msg: "No LXC container named '{{ ct_name }}' found - nothing to delete."

    - name: Stop and destroy the container
      when: existing_ct.stdout | trim | length > 0
      vars:
        target_ctid: "{{ existing_ct.stdout | trim }}"
      block:
        - name: Stop the container if it's running
          ansible.builtin.command: pct stop {{ target_ctid }}
          changed_when: true
          failed_when: false

        - name: Destroy the container
          ansible.builtin.command: pct destroy {{ target_ctid }} --purge
          changed_when: true

        - name: Show result
          ansible.builtin.debug:
            msg: "LXC container '{{ ct_name }}' (CTID {{ target_ctid }}) has been destroyed."
